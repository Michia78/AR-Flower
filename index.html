<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body style="margin: 0;">

    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate
        style="width: 100vw; height: 100vh;">
        
        <button slot="ar-button" style="position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: #000; color: #fff; border-radius: 30px; border: none; font-weight: bold;">
            🚀 BẤM ĐỂ XEM AR
        </button>
    </model-viewer>

</body>
</html>
