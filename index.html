<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Trải nghiệm AR Bông Hoa</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; background-color: #ffffff; }
        .btn-ar {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: #ff4081; color: white; border: none;
            border-radius: 25px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/Rose.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="none" 
        autoplay 
        shadow-intensity="1">
        
        <button slot="ar-button" class="btn-ar">
            XEM TRONG KHÔNG GIAN THỰC
        </button>
    </model-viewer>

</body>
</html>
